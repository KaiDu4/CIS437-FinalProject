<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeachShare</title>
  <script type="module" src="index.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="welcome-banner">
    <header class="header">
      <div class="logo"><h1>TeachShare</h1></div>
    </header>
    </div>
    <div class="page-container">
      <div class="login-box">
        <h2 class="title">Sign Up!</h2>
        <p class="subtitle">Please Sign Up Below</p>

        <form id="login-form" class="form">
          <div class="form-group">
            <label for="fullname">Name:</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Email" autocomplete="on">
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="text" id="password" name="password" placeholder="Password" autocomplete="on">
          </div>
          <button type="submit" class="button" id="Submit">Sign Up</button>
        </form>
        <div class="quick-access">
          <div class="divider">
            <span class="divider-text">Quick Access</span>
          </div>
          <br>
          <button type="button" id="google" class="btn-google">Google</button>
        </div>
        <br>
        <a href="login.html">Sign In Here</a>
      </div>
    </div>
  </body>
</html>
