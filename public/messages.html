<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeachShare Messages</title>
    <script type="module" src="messages.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="chat-container">
    <h2>Chat</h2>
    <div id="messages-display" style="height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px;">
    </div>

    <div class="chat-input" style="margin-top: 10px;">
        <input type="text" id="message-input" placeholder="Type a message..." style="width: 70%;">
        <button id="send-btn">Send</button>
    </div>
    <br>
    <a href="dashboard.html">Dashboard</a>
</div>
</body>
</html>
