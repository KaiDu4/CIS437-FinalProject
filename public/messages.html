<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeachShare Messages</title>
    <script type="module" src="messages.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="welcome-banner">
    <h1>TeachShare Messages</h1>
    <div class="link">
        <a href="upload.html"><h3>Upload a Lesson</h3></a>
        <a href="dashboard.html"><h3>Dashboard</h3></a>
        <a href="browse.html"><h3>Browse</h3></a>
        <button id="logout-btn">Logout</button>
    </div>
</div>

<div class="chat-container">

    <div class="contacts-sidebar">
        <h3>Conversations</h3>
        <div id="contacts-list"></div>
    </div>

    <div class="chat-area">
        <div id="messages-display">
            <p>Select a conversation to start chatting!</p>
        </div>

        <div class="chat-input">
            <label for="recipient-email">Email:</label>
            <input type="text" id="recipient-email" readonly placeholder="Select a contact...">
            <label for="message-input">Message:</label>
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>
</body>
</html>
