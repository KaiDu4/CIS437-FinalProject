<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeachShare Messages</title>
    <script type="module" src="messages.js" defer></script>
    <script src="nav.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav">
    <div class="nav__brand">
        <img src="logo.png" alt="TeachShare Logo" class="nav__logo">
        <span class="nav__title">TeachShare</span>
    </div>
    <button class="nav__toggle" id="nav-toggle" aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul class="nav__menu" id="nav-menu">
        <li><a href="upload.html">Upload a Lesson</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="browse.html">Browse</a></li>
        <li><button id="logout-btn" class="nav__logout">Logout</button></li>
    </ul>
</nav>

<div class="chat-container">
    <div class="contacts-sidebar">
        <h3>Conversations</h3>
        <div id="contacts-list"></div>
    </div>

    <div class="chat-area">
        <div id="messages-display">
            <p style="text-align: center; color: #888; margin-top: 50px;">Select a conversation to start chatting!</p>
        </div>
        <div class="chat-input">
            <label for="recipient-email">Email:</label>
            <input type="text" id="recipient-email" readonly placeholder="Select a contact...">
            <label for="message-input">Message:</label>
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>
</body>
</html>
