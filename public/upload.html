<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeachShare Upload</title>
    <script type="module" src="upload.js" defer></script>
    <script src="nav.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav">
    <div class="nav__brand">
        <img src="logo.png" alt="TeachShare Logo" class="nav__logo">
        <span class="nav__title">TeachShare</span>
    </div>
    <button class="nav__toggle" id="nav-toggle" aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul class="nav__menu" id="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="messages.html">Send a Chat</a></li>
        <li><a href="browse.html">Browse</a></li>
    </ul>
</nav>

<div class="page-container">
    <div class="login-box">
        <form id="upload" class="form">
            <div class="form-group">
                <label for="name">Author</label>
                <input type="text" name="name" id="name" placeholder="Enter Your Name" required>
            </div>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" placeholder="Title of Lesson" required>
            </div>
            <div class="form-group">
                <label for="file">File</label>
                <input type="file" name="file" id="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt">
            </div>
            <div id="thumbnail-preview"></div>
            <br>
            <button type="submit" id="submit">Submit</button>
        </form>
    </div>
</div>
</body>
</html>
