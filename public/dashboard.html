<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeachShare Dashboard</title>
    <script type="module" src="dashboard.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <div class="dashboard">
            <h1>TeachShare Dashboard</h1>
        </div>
        <div class="link">
            <a href="upload.html"><h3>Upload a Lesson</h3></a>
            <a href="messages.html"><h3>Send a Chat</h3></a>
            <button id="logout-btn">Logout</button>
        </div>
        <div class="main-sections">
            <div class="recently_viewed">
                <h2>Recently Viewed</h2>
                <div class="recently_viewed_content">
                    <div class="recently_viewed_item">
                        <div class="recently_viewed_image">
                            <h3>Image placeholder</h3>
                        </div>
                        <div class="recently_viewed_info">
                            <div class="recently_viewed_title">
                                <h4>Title</h4>
                            </div>
                            <div class="recently_viewed_date">
                                <h4>Date</h4>
                            </div>
                            <div class="Creator_Info">
                                <h4>Creator</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="recently_uploaded">
                    <h2>Recently Uploaded</h2>
                    <div class="recently_uploaded_content">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
